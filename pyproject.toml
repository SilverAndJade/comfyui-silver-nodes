[project]
name = "silver-nodes"
description = "A collection of utility nodes for ComfyUI that enhance workflow capabilities with advanced loaders and processing tools."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["# Core Dependencies", "beautifulsoup4>=4.11.1  # For web scraping and HTML parsing", "moviepy>=1.0.3          # For video and audio processing", "numpy>=1.21.0           # For numerical operations", "Pillow>=9.0.0           # For image processing", "opencv-python-headless>=4.5.0  # For image/video processing", "requests>=2.28.1        # For HTTP requests", "torch>=1.9.0            # PyTorch for deep learning", "urllib3>=1.26.9         # For URL handling", "ffmpeg-python>=0.2.0    # For audio processing with ffmpeg", "# Development Dependencies (optional)", "# black>=21.12b0        # Code formatter", "# flake8>=4.0.0         # Linter", "# pytest>=6.2.5         # Testing framework", "# types-requests>=2.28.0 # Type stubs for requests"]

[project.urls]
Repository = "https://github.com/SilverAndJade/comfyui-silver-nodes"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/SilverAndJade/comfyui-silver-nodes/wiki"
"Bug Tracker" = "https://github.com/SilverAndJade/comfyui-silver-nodes/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "comfyui-silver-nodes"
Icon = ""
includes = [] 
